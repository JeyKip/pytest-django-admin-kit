[tox]
requires =
    tox>=4.0
    tox-uv>=1.16
# Nine Django minors, each on its oldest supported interpreter at or above the 3.8
# floor and on its newest. Eighteen cells. The interpreters in the middle of a range
# are left out: a break that shows on 3.11 but on neither 3.10 nor 3.14 is rare enough
# not to be worth doubling the matrix for.
env_list =
    py{38,310}-dj{32,40}
    py{38,311}-dj41
    py{38,312}-dj42
    py{310,312}-dj50
    py{310,313}-dj51
    py{310,314}-dj52
    py{312,314}-dj{60,61}
# uv provisions every interpreter, so a missing one is a real failure rather than a
# reason to skip a cell quietly.
skip_missing_interpreters = false

[testenv]
description = Run the test suite on one Python and Django pair
package = wheel
wheel_build_env = .pkg
deps =
    dj32: django>=3.2,<4.0
    dj40: django>=4.0,<4.1
    dj41: django>=4.1,<4.2
    dj42: django>=4.2,<5.0
    dj50: django>=5.0,<5.1
    dj51: django>=5.1,<5.2
    dj52: django>=5.2,<6.0
    dj60: django>=6.0,<6.1
    dj61: django>=6.1,<6.2
    # pytest-django is pinned per Django version because no single release spans 3.2
    # to 6.1. 4.8.0 is the last that claims 3.2; 4.14.0 claims only 5.2 and 6.0.
    # Django 4.0 is claimed by nothing after 4.5.2, so its cells run on 4.8.0 and are
    # expected to pass on behaviour rather than on a support claim.
    dj{32,40,41}: pytest-django==4.8.0
    dj42: pytest-django==4.11.1
    dj{50,51}: pytest-django==4.12.0
    dj{52,60,61}: pytest-django==4.14.0
# pytest and playwright are deliberately unpinned. The resolver already caps them per
# interpreter — 3.8 cells get pytest 8.3.5 and playwright 1.48.0, newer cells get
# current — so pinning here would only freeze that ceiling in place.
commands =
    pytest {posargs}
